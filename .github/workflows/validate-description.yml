name: Validate description

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tcp-frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate_tcp_frames.py
